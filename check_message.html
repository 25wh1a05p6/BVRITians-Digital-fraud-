<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield - Check Message</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        header {
            background: #14213d;
            color: white;
            padding: 18px 60px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #14213d;
        }

        p {
            text-align: center;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            margin-top: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: #14213d;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 13px 30px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c92f3b;
        }

        .example {
            margin-top: 20px;
            padding: 15px;
            background: #fff8e1;
            border-radius: 8px;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🛡️ ScamShield</div>
</header>

<div class="container">

    <div class="box">

        <h1>🔍 Check a Message</h1>

        <p>
            Paste a suspicious SMS, WhatsApp message or email below.
        </p>

        <textarea id="fraudMessage"
            placeholder="Paste your suspicious message here..."></textarea>

        <button onclick="analyzeMessage()">
            🔍 Analyze Message
        </button>

        <div class="example">
            <strong>Example:</strong><br>
            "Congratulations! You have won ₹50,000.
            Click this link immediately and share your OTP to claim your prize."
        </div>

    </div>

</div>

<script>

function analyzeMessage() {

    let message = document.getElementById("fraudMessage").value;

    if (message.trim() === "") {
        alert("Please enter or paste a message first.");
        return;
    }

    // Store the message so the next page can use it
    localStorage.setItem("fraudMessage", message);

    // Go to risk result page
    window.location.href = "risk.html";
}

</script>

</body>
</html>
